# values.yaml für nginx Helm Chart

replicaCount: 2

image:
  repository: bitnami/nginx
  tag: 1.25.3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  hostname: nginx.example.com
  tls: true
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
