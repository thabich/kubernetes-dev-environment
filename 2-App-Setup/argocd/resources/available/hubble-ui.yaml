apiVersion: v1
kind: List
metadata:
  resourceVersion: ""
items:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: hubble
    namespace: kube-system
  spec:
    hostnames:
    - hubble.k8s.findichgut.net
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: central
      namespace: kube-system
    rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: hubble-ui
        port: 80
        weight: 1
      matches:
      - path:
          type: PathPrefix
          value: /
