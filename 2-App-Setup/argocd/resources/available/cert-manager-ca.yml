apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: devca
  namespace: cert-manager
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: devca
      namespace: cert-manager
    type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: devca
  namespace: cert-manager
spec:
  ca:
    secretName: devca