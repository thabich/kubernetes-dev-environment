---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: devca
  namespace: kube-system
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: devca
      namespace: kube-system
    type: Opaque
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: devca
  namespace: kube-system
spec:
  ca:
    secretName: devca