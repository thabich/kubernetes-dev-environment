apiVersion: dashboard.tekton.dev/v1alpha1  # <-- Das ist die Extension CRD API
kind: Extension
namespace: tekton-dashboard
metadata:
  name: pods
spec:
  displayName: Pods
  apiVersion: core/v1
  name: pods
  kind: Pod
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: tekton-dashboard-extension-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-dashboard-extension-pods
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-dashboard-extension-pods
  apiGroup: rbac.authorization.k8s.io
---
