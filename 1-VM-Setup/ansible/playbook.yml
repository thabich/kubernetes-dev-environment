- hosts: service
  name: Deploy DHCP service
  become: true
  roles:
    - role: dnsmasq
      tags: [dnsmasq]

- hosts: all
  name: Deploy base system
  become: true
  roles:
    - role: common
      tags: [common]
    - role: users
      tags: [users]
    - role: firewall
      tags: [firewall]
    - role: network
      tags: [network]
    - role: packages
      tags: [packages]

    - role: kubernetes
      tags: [kubernetes]

- hosts: service
  run_once: true
  name: Deploy Service Host
  become: false
  roles:
    - role: nfs-server
      tags: [nfs-server]
    - role: helm
      tags: [helm]
    - role: cilium
      tags: [cilium]
    - role: python
      tags: [python]
    - role: git
      tags: [git]
    - role: argocd
      tags: [argocd]
    - role: squid
      tags: [squid]
    - role: external-access
      tags: [external-access]
    - role: sealed-secrets
      tags: [sealed-secrets]
    - role: tekton-cli
      tags: [tekton-cli]
