- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    daemon_reload: yes
    state: restarted
    enabled: true

- name: Restart containerd
  ansible.builtin.systemd:
    name:  containerd
    state: restarted
    enabled: true
  register: containerd_restarted

- name: Wait for CRI readiness
  ansible.builtin.command:
    cmd: crictl info
  register: cri
  retries: 20
  delay: 2
  until: cri.rc == 0
  listen: Restart containerd