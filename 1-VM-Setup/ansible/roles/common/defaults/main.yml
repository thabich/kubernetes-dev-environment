common_apt_repositories: []
common_extra_apt_repositories: []
common_admin_user: "{{ admin_user | default('vmadm') }}"
common_default_packages: []
common_extra_packages: []
common_default_remove_packages: []
common_extra_remove_packages: []
common_default_hold_packages: []
common_extra_hold_packages: []
common_domain: "{{ domain }}"

common_internal_network: "{{ internal_network | default('10.0.3.0/24') }}"
common_dhcp_range_start: "{{ common_internal_network | ansible.utils.ipaddr('5') | ansible.utils.ipaddr('address')  }}"
common_dhcp_range_end: "{{ common_internal_network | ansible.utils.ipaddr('100') | ansible.utils.ipaddr('address') }}"
common_dhcp_lease_time: "1h"
common_dhcp_interface: "{{ dhcp_interface | default('enp0s9') }}" 
common_service_host_ip: "{{ common_internal_network | ansible.utils.ipaddr('3') }}"
common_default_gateway: "{{ common_internal_network | ansible.utils.ipaddr('2') | ansible.utils.ipaddr('address') }}"

common_dns_host_records: []
common_dns_cnames: []
common_upstream_dns: "8.8.8.8"

common_bashrc_block: |
  if [ -x /usr/bin/dircolors ]; then
      test -r ~/.dircolors && eval "$(dircolors -b ~/.dircolors)" || eval "$(dircolors -b)"
      alias ls='ls --color=auto'
      alias grep='grep --color=auto'
      alias fgrep='fgrep --color=auto'
      alias egrep='egrep --color=auto'
  fi
  alias ll='ls -alF'
  alias la='ls -A'
  alias l='ls -CF'

common_extra_bashrc_block: ""

common_vim_settings: |
  unlet! skip_defaults_vim
  source $VIMRUNTIME/defaults.vim
  " Your custom overrides follow below
  set mouse=
  syntax on
  set backspace=indent,eol,start
  set tabstop=2 shiftwidth=2 expandtab

common_extra_vim_settings: ""