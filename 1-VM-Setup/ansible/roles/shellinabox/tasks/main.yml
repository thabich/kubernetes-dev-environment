- name: Install binaries
  become: true
  ansible.builtin.apt: 
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
    - shellinabox

- name: Copy certificate (cert + key are expected in one file) 
  become: true
  ansible.builtin.copy:
    src: shellinabox-key.vault
    dest: /var/lib/shellinabox/certificate-{{ shellinabox_hostname }}.pem
    mode: "0600"
    owner: shellinabox
    group: shellinabox

- name: Copy themes
  become: true
  ansible.builtin.copy:
    src: themes
    dest: /etc/shellinabox

- name: Configure defaults
  become: true
  ansible.builtin.copy:
    src: defaults
    dest: /etc/default/shellinabox
    mode: "0644"
    owner: root
    group: root