cilium_admin_user: "{{ admin_user | default('vmadm') }}"
cilium_helm_binary: "/usr/local/bin/helm-3" 
cilium_use_kube_proxy: "{{ use_kube_proxy | default(true) }}"
cilium_use_gateway_api: "{{ (not use_kube_proxy)|bool | ternary(true, false) }}"
cilium_l2_announcements: "{{ (not use_kube_proxy)|bool | ternary(true, false) }}"