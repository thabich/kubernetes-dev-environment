common_apt_repositories:
- name: debian-backports
  repo: "http://deb.debian.org/debian"
  suites: "{{ ansible_facts['distribution_release'] }}-backports"
  key: /usr/share/keyrings/debian-archive-keyring.gpg
- name: docker
  repo: "https://download.docker.com/linux/debian"
  key: "https://download.docker.com/linux/debian/gpg"



common_admin_user: vmadm

common_default_packages:
- python3
- python3-venv
- apt-transport-https
- ca-certificates
- curl
- gnupg-agent
- netplan.io
- systemd-resolved

common_default_hold_packages:
- grub-pc

common_default_remvoe_packages:
- dhcpcd-base

common_domain: "k8s.findichgut.net" 

service_host_ip: "192.168.56.150"